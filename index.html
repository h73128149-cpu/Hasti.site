<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasti Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050508;
            color: #fff;
            font-family: 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 0;
        }

        /* پس‌زمینه ستاره‌ای متحرک */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(105vh); opacity: 0; }
        }

        /* باکس اصلی شیشه‌ای */
        .wrapper {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        /* عکس پروفایل */
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            margin: 0 auto 15px auto;
            display: block;
        }

        h2 {
            font-size: 1.1rem;
            color: #ff3366;
            margin-bottom: 12px;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e2e8f0;
        }

        /* شمارشگر */
        .counter-grid {
            display: flex;
            justify-content: space-around;
            gap: 8px;
            margin-top: 10px;
        }

        .counter-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 51, 102, 0.3);
            padding: 10px 5px;
            border-radius: 12px;
            flex: 1;
            text-align: center;
        }

        .counter-number {
            font-size: 1.2rem;
            font-weight: bold;
            color: #ff3366;
            margin-bottom: 4px;
        }

        .counter-label {
            font-size: 0.75rem;
            color: #cbd5e1;
        }

        /* پلیر موزیک جدید و چرخان */
        .music-player {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.4);
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 51, 102, 0.3);
            cursor: pointer;
            transition: 0.3s;
            width: fit-content;
            margin: 0 auto;
        }

        .music-player:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .disc-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #ff3366, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .disc-icon.playing {
            animation: rotateDisc 2s linear infinite;
        }

        @keyframes rotateDisc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .music-status {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        /* ذرات کلیک روی صفحه */
        .click-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ff3366;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: explode 0.6s forwards ease-out;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="particles"></div>

    <div class="wrapper">
        <!-- عکس پروفایل -->
        <div class="card">
            <img src="pic.jpg" alt="Profile" class="profile-pic">
            <p>قشنگ‌ترین اتفاق زندگی منه.</p>
        </div>

        <!-- شمارشگر -->
        <div class="card">
            <h2>لحظاتی که با هم بودیم...</h2>
            <div class="counter-grid">
                <div class="counter-box">
                    <div class="counter-number" id="seconds">0</div>
                    <div class="counter-label">ثانیه</div>
                </div>
                <div class="counter-box">
                    <div class="counter-number" id="minutes">0</div>
                    <div class="counter-label">دقیقه</div>
                </div>
                <div class="counter-box">
                    <div class="counter-number" id="hours">0</div>
                    <div class="counter-label">ساعت</div>
                </div>
                <div class="counter-box">
                    <div class="counter-number" id="days">0</div>
                    <div class="counter-label">روز</div>
                </div>
            </div>
        </div>

        <!-- دل‌نوشته -->
        <div class="card">
            <h2>یک دل‌نوشته کوچک</h2>
            <p>حتی تو تاریک‌ترین روزها هم، حضور تو برام مثل یک ستاره‌ست. روزت مبارک هستیِ من...</p>
        </div>

        <!-- پلیر موزیک -->
        <div class="card">
            <h2>موزیک دلخواه</h2>
            <div class="music-player" onclick="toggleMusic()">
                <div class="disc-icon" id="disc">🎵</div>
                <div class="music-status" id="musicText">پخش موزیک</div>
            </div>
            <audio id="bgMusic" src="music.mp3" loop></audio>
        </div>
    </div>

    <script>
        // ۱. بارش ستاره‌ها در پس‌‌زمینه
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 35; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * -50 + '%';
            star.style.width = Math.random() * 3 + 1 + 'px';
            star.style.height = star.style.width;
            star.style.animationDuration = Math.random() * 5 + 3 + 's';
            star.style.animationDelay = Math.random() * 5 + 's';
            particlesContainer.appendChild(star);
        }

        // ۲. شمارشگر زمان (فرضی قابل تنظیم)
        const startDate = new Date("2025-11-01T00:00:00"); // می‌تونی تاریخ شروع رو اینجا عوض کنی
        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = hours;
            document.getElementById("minutes").innerText = minutes;
            document.getElementById("seconds").innerText = seconds;
        }
        setInterval(updateCounter, 1000);
        updateCounter();

        // ۳. کنترل موزیک
        const music = document.getElementById('bgMusic');
        const disc = document.getElementById('disc');
        const musicText = document.getElementById('musicText');
        let isPlaying = false;

        function toggleMusic() {
            if (!isPlaying) {
                music.play();
                disc.classList.add('playing');
                musicText.innerHTML = "توقف موزیک";
                isPlaying = true;
            } else {
                music.pause();
                disc.classList.remove('playing');
                musicText.innerHTML = "پخش موزیک";
                isPlaying = false;
            }
        }

        // ۴. افکت کلیک
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('div');
                particle.classList.add('click-particle');
                particle.style.left = e.clientX + 'px';
                particle.style.top = e.clientY + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 50 + 20;
                particle.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        });
    </script>
</body>
</html>
