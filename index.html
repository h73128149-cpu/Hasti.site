<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasti Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050508;
            color: #fff;
            font-family: 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* پس‌زمینه ستاره‌ای متحرک */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(105vh); opacity: 0; }
        }

        /* باکس شیشه‌ای اصلی */
        .container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* عکس پروفایل با حاشیه نئونی */
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            transition: 0.3s ease;
        }

        .profile-pic:hover {
            transform: scale(1.05);
            border-color: #a855f7;
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
        }

        /* افکت تایپ متن */
        h1 {
            font-size: 1.3rem;
            font-weight: 500;
            color: #e2e8f0;
            margin-bottom: 25px;
            min-height: 40px;
            border-left: 2px solid #a855f7;
            white-space: nowrap;
            overflow: hidden;
            display: inline-block;
            animation: blink 0.75s step-end infinite;
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #a855f7; }
        }

        /* دکمه و پلیر موزیک کاستوم */
        .music-player {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: 0.3s;
        }

        .music-player:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .disc-icon {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            animation: none;
        }

        .disc-icon.playing {
            animation: rotateDisc 2s linear infinite;
        }

        @keyframes rotateDisc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .music-status {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        /* ذرات کلیک روی صفحه */
        .click-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #a855f7;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: explode 0.6s forwards ease-out;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="particles"></div>

    <div class="container">
        <!-- عکس شما (نام فایل باید pic.jpg باشه) -->
        <img src="pic.jpg" alt="Profile" class="profile-pic">

        <div>
            <h1 id="typewriter"></h1>
        </div>

        <!-- پلیر موزیک سفارشی (نام فایل باید music.mp3 باشه) -->
        <div class="music-player" onclick="toggleMusic()">
            <div class="disc-icon" id="disc">🎵</div>
            <div class="music-status" id="musicText">پخش موزیک</div>
        </div>
        <audio id="bgMusic" src="music.mp3" loop></audio>
    </div>

    <script>
        // ۱. ساخت ذرات ستاره‌ای در پس‌زمینه
        const particlesContainer = document.getElementById('particles');
        const starCount = 35;
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * -50 + '%';
            star.style.width = Math.random() * 3 + 1 + 'px';
            star.style.height = star.style.width;
            star.style.animationDuration = Math.random() * 5 + 3 + 's';
            star.style.animationDelay = Math.random() * 5 + 's';
            particlesContainer.appendChild(star);
        }

        // ۲. متن تایپ‌‌شونده (می‌تونی متن دلخواهت رو اینجا عوض کنی)
        const text = "به دنیای تاریک من خوش آمدید...";
        let index = 0;
        function typeWriter() {
            if (index < text.length) {
                document.getElementById("typewriter").innerHTML += text.charAt(index);
                index++;
                setTimeout(typeWriter, 120);
            }
        }
        window.onload = typeWriter;

        // ۳. کنترل موزیک و چرخش دیسک
        const music = document.getElementById('bgMusic');
        const disc = document.getElementById('disc');
        const musicText = document.getElementById('musicText');
        let isPlaying = false;

        function toggleMusic() {
            if (!isPlaying) {
                music.play();
                disc.classList.add('playing');
                musicText.innerHTML = "توقف موزیک";
                isPlaying = true;
            } else {
                music.pause();
                disc.classList.remove('playing');
                musicText.innerHTML = "پخش موزیک";
                isPlaying = false;
            }
        }

        // ۴. افکت ذرات رنگی با کلیک روی صفحه
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 6; i++) {
                const particle = document.createElement('div');
                particle.classList.add('click-particle');
                particle.style.left = e.clientX + 'px';
                particle.style.top = e.clientY + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 60 + 20;
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;
                
                particle.style.setProperty('--dx', dx + 'px');
                particle.style.setProperty('--dy', dy + 'px');
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        });
    </script>
</body>
</html>
