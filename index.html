<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasti Site</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050508;
            color: #fff;
            font-family: 'Tahoma', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* پس‌زمینه ستاره‌ای متحرک */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10px); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(105vh); opacity: 0; }
        }

        /* باکس‌های شیشه‌ای */
        .page {
            display: none;
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 51, 102, 0.2);
            padding: 25px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
        }

        .page.active {
            display: block;
        }

        /* صفحه رمز عبور */
        input[type="password"] {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 51, 102, 0.4);
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            margin: 15px 0;
            outline: none;
        }

        .btn {
            background: linear-gradient(135deg, #ff3366, #a855f7);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.3);
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        .error-msg {
            color: #ff3366;
            font-size: 0.85rem;
            margin-top: 10px;
            display: none;
        }

        /* عکس پروفایل صفحه دوم */
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 51, 102, 0.4);
            box-shadow: 0 0 25px rgba(255, 51, 102, 0.2);
            margin: 0 auto 15px auto;
            display: block;
        }

        h2 {
            font-size: 1.2rem;
            color: #ff3366;
            margin-bottom: 15px;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e2e8f0;
            margin-bottom: 20px;
        }

        /* تایم‌شمار */
        .counter-grid {
            display: flex;
            justify-content: space-around;
            gap: 6px;
            margin: 15px 0;
        }

        .counter-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 51, 102, 0.3);
            padding: 8px 4px;
            border-radius: 12px;
            flex: 1;
        }

        .counter-number {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ff3366;
        }

        .counter-label {
            font-size: 0.7rem;
            color: #cbd5e1;
        }

        /* پلیر موزیک */
        .music-player {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 50px;
            border: 1px solid rgba(255, 51, 102, 0.3);
            cursor: pointer;
            margin: 15px 0;
            transition: 0.3s;
        }

        .disc-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ff3366, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
        }

        .disc-icon.playing {
            animation: rotateDisc 2s linear infinite;
        }

        @keyframes rotateDisc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .music-status {
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        /* ذرات کلیک */
        .click-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #ff3366;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: explode 0.6s forwards ease-out;
        }

        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="particles"></div>

    <!-- ۱. صفحه رمز عبور -->
    <div id="loginPage" class="page active">
        <h2>ورود به دنیای ما</h2>
        <p style="font-size: 0.85rem; color: #aaa;">لطفاً رمز عبور را وارد کنید:</p>
        <input type="password" id="passwordInput" placeholder="رمز عبور...">
        <button class="btn" onclick="checkPassword()">ورود</button>
        <div class="error-msg" id="errorMsg">رمز عبور اشتباه است!</div>
    </div>

    <!-- ۲. صفحه اصلی (تایم‌شمار و موزیک و دکمه دل‌نوشته) -->
    <div id="mainPage" class="page">
        <h2>لحظاتی که با هم بودیم</h2>
        <div class="counter-grid">
            <div class="counter-box">
                <div class="counter-number" id="seconds">0</div>
                <div class="counter-label">ثانیه</div>
            </div>
            <div class="counter-box">
                <div class="counter-number" id="minutes">0</div>
                <div class="counter-label">دقیقه</div>
            </div>
            <div class="counter-box">
                <div class="counter-number" id="hours">0</div>
                <div class="counter-label">ساعت</div>
            </div>
            <div class="counter-box">
                <div class="counter-number" id="days">0</div>
                <div class="counter-label">روز</div>
            </div>
        </div>

        <div class="music-player" onclick="toggleMusic()">
            <div class="disc-icon" id="disc">🎵</div>
            <div class="music-status" id="musicText">پخش موزیک دلخواه</div>
        </div>
        <audio id="bgMusic" src="music.mp3" loop></audio>

        <button class="btn" onclick="goToLetter()">مشاهده دل‌نوشته 💌</button>
    </div>

    <!-- ۳. صفحه دوم (عکس و متن تبریک) -->
    <div id="letterPage" class="page">
        <img src="pic.jpg" alt="Profile" class="profile-pic">
        <h2>قشنگ‌ترین اتفاق زندگی منه</h2>
        <p>حتی تو تاریک‌ترین روزها هم، حضور تو برام مثل یک ستاره‌ست. روزت مبارک هستیِ من...</p>
        <button class="btn" onclick="goBackToMain()">بازگشت به صفحه قبل 🔙</button>
    </div>

    <script>
        // بارش ستاره‌ها
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * -50 + '%';
            star.style.width = Math.random() * 3 + 1 + 'px';
            star.style.height = star.style.width;
            star.style.animationDuration = Math.random() * 5 + 3 + 's';
            star.style.animationDelay = Math.random() * 5 + 's';
            particlesContainer.appendChild(star);
        }

        // بررسی رمز عبور (Hasti.H)
        function checkPassword() {
            const pass = document.getElementById('passwordInput').value;
            if (pass === "Hasti.H") {
                document.getElementById('loginPage').classList.remove('active');
                document.getElementById('mainPage').classList.add('active');
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }

        // تغییر صفحات
        function goToLetter() {
            document.getElementById('mainPage').classList.remove('active');
            document.getElementById('letterPage').classList.add('active');
        }

        function goBackToMain() {
            document.getElementById('letterPage').classList.remove('active');
            document.getElementById('mainPage').classList.add('active');
        }

        // تایم‌شمار (تاریخ شروع)
        const startDate = new Date("2025-11-01T00:00:00");
        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = hours;
            document.getElementById("minutes").innerText = minutes;
            document.getElementById("seconds").innerText = seconds;
        }
        setInterval(updateCounter, 1000);
        updateCounter();

        // کنترل موزیک
        const music = document.getElementById('bgMusic');
        const disc = document.getElementById('disc');
        const musicText = document.getElementById('musicText');
        let isPlaying = false;

        function toggleMusic() {
            if (!isPlaying) {
                music.play();
                disc.classList.add('playing');
                musicText.innerHTML = "توقف موزیک";
                isPlaying = true;
            } else {
                music.pause();
                disc.classList.remove('playing');
                musicText.innerHTML = "پخش موزیک دلخواه";
                isPlaying = false;
            }
        }

        // افکت کلیک
        document.addEventListener('click', (e) => {
            for (let i = 0; i < 4; i++) {
                const particle = document.createElement('div');
                particle.classList.add('click-particle');
                particle.style.left = e.clientX + 'px';
                particle.style.top = e.clientY + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const distance = Math.random() * 40 + 15;
                particle.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 600);
            }
        });
    </script>
</body>
</html>
